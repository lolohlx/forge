name: hook-sessionstart
# Prouve les deux hooks (pas Claude Code lui-même) sous Linux, macOS et Windows
# (Git Bash, PowerShell 5.1, PowerShell 7) : le démarrage (principes intacts, plafond de
# taille) et la règle pivot (garde-pivot.mjs, forme exec node). Puis valide le manifeste.
on:
  push:
  pull_request:

jobs:
  hook:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, shell: bash }
          - { os: macos-latest, shell: bash }
          - { os: windows-latest, shell: bash }
          - { os: windows-latest, shell: powershell }
          - { os: windows-latest, shell: pwsh }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node tests/test-hook.mjs ${{ matrix.shell }}
      - run: node tests/test-garde-pivot.mjs
      - run: npx --yes @anthropic-ai/claude-code@latest plugin validate ./forge --strict
        if: matrix.os == 'ubuntu-latest'
